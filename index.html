<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400&display=swap" rel="stylesheet">
<title>Pin</title>
<meta name="theme-color" content="#D6E8F6">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html{height:100%;background-color:#D6E8F6;background-repeat:no-repeat;background-size:100% 100%;background-image:radial-gradient(70px 38px at 16% 7%,rgba(255,255,255,.95),transparent 72%),radial-gradient(100px 46px at 84% 11%,rgba(255,255,255,.9),transparent 72%),radial-gradient(130px 56px at 72% 33%,rgba(255,255,255,.75),transparent 72%),radial-gradient(110px 50px at 10% 46%,rgba(255,255,255,.7),transparent 72%),linear-gradient(180deg,#D6E8F6 0%,#E3ECF7 100%)}
body{height:100%;margin:0;background:none;color:#fff;font-family:"Bricolage Grotesque",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:manipulation}
main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(40px,9vh,72px);padding:env(safe-area-inset-top,0) 24px env(safe-area-inset-bottom,0)}
.dots{display:flex;gap:20px}
.dots i{width:14px;height:14px;border-radius:50%;background:#8b97a6;transition:background .15s;filter:drop-shadow(0 1px 3px rgba(60,80,110,.3))}
.dots i.on{background:#fff}
.dots.no{animation:sh .5s}
@keyframes sh{0%,100%{transform:translateX(0)}20%{transform:translateX(-14px)}40%{transform:translateX(14px)}60%{transform:translateX(-14px)}80%{transform:translateX(14px)}}
.pad{display:grid;grid-template-columns:repeat(3,84px);gap:clamp(8px,2.2vh,18px) 28px}
.pad button{height:72px;border:0;background:none;padding:0;font:inherit;font-size:38px;font-weight:300;color:#fff;text-shadow:0 1px 8px rgba(60,80,110,.35);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:opacity .1s,transform .1s}
.pad button:active{opacity:.4;transform:scale(.92)}
.pad button{width:72px;justify-self:center;border-radius:50%}.pad button[data-k]{background:rgba(110,122,138,.32);transition:background .1s,opacity .1s,transform .1s}.pad button[data-k]:active{background:rgba(110,122,138,.55);opacity:1}
.pad button[data-k=x]{width:54px;height:54px;align-self:center;background:rgba(110,122,138,.16)}.pad button[data-k=x]:active{background:rgba(110,122,138,.3)}
.pad .gap{visibility:hidden}.pad svg{filter:drop-shadow(0 1px 4px rgba(60,80,110,.35))}
</style></head><body>
<main>
<div class="dots" id="d"><i></i><i></i><i></i><i></i></div>
<div class="pad" id="p"></div>
</main>
<script>
const PIN="3245";let v="",lk=false;
const d=document.getElementById("d"),p=document.getElementById("p");
const BK='<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6-7z"/><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"/></svg>';
p.innerHTML=[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join("")+`<button class="gap" tabindex="-1" aria-hidden="true"></button><button data-k="0">0</button><button data-k="x" aria-label="Cancella">${BK}</button>`;
function paint(){[...d.children].forEach((e,i)=>e.classList.toggle("on",i<v.length))}
function key(k){if(lk)return;if(v.length>=4&&k!=="x")return;if(k==="x")v=v.slice(0,-1);else v+=k;paint();
 if(v.length===4){if(v===PIN)location.href="/lei";else{lk=true;if(navigator.vibrate)navigator.vibrate(120);d.classList.add("no");setTimeout(()=>{d.classList.remove("no");v="";paint();lk=false},500)}}}
p.addEventListener("click",e=>{const b=e.target.closest("button[data-k]");if(b)key(b.dataset.k)});
document.addEventListener("keydown",e=>{if(/^\d$/.test(e.key))key(e.key);else if(e.key==="Backspace")key("x")});
</script></body></html>
